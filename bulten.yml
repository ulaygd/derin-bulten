name: Saatlik Otonom Bulten

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  calistir:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Botu Calistir
        run: |
          python bulten.py
