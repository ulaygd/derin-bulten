name: Derin Bulten Botu

on:
  schedule:
    - cron: '0 */2 * * *'  # Her 2 saatte bir düzenli çalışır
  workflow_dispatch:        # İstediğin an manuel tetikleyebilmen için

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutuphaneleri yukle
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests google-genai tenacity

      - name: Botu calistir
        run: python bot.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
