name: News Briefing
on:
  schedule:
    # UTC 05,07,...,19 = Turkey time 08,10,...,22
    - cron: "0 5,7,9,11,13,15,17,19 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brifing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore seen news
        uses: actions/cache@v4
        with:
          path: gorulenler.json
          key: gorulenler-${{ github.run_id }}
          restore-keys: gorulenler-
      - run: pip install requests edge-tts
      - run: python gunluk_brifing.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ARAMA: "0"
